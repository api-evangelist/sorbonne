source: >-
  Live fetch of https://auth.id.sorbonne-universite.fr/saml/metadata (SAML 2.0
  EntityDescriptor, HTTP 200, application/xml, 11,704 bytes, Server: Apache), archived
  verbatim alongside this file at identity-federation/sorbonne-idp-saml-metadata.xml;
  the RENATER production IdP aggregate
  https://metadata.federation.renater.fr/renater/main/main-idps-renater-metadata.xml
  (HTTP 200, 2,351,334 bytes) and the RENATER all-entities aggregate
  https://metadata.federation.renater.fr/renater/main/main-all-renater-metadata.xml
  (HTTP 200, 11,636,489 bytes), both parsed for every EntityDescriptor whose entityID is
  under sorbonne-universite.fr; DNS resolution of every host involved; the RIPE database
  record for the resolved address; and the TLS certificate presented by each host, to
  settle who operates the thing each contract describes.
description: >-
  Sorbonne University's SAML 2.0 identity federation surface — and the one genuinely
  institution-operated, machine-readable contract in this profile.

  Operator was settled by IP ownership and certificate procurement, not by hostname,
  because hostname alone is what produced the university-cohort misattribution this
  pipeline exists to prevent. The answer here is the opposite of Monash's: Sorbonne's
  identity provider really is Sorbonne's. auth.id.sorbonne-universite.fr is a CNAME to
  llng.sorbonne-universite.fr, which resolves to 134.157.54.171 inside FR-UPMC-NET
  (RIPE inetnum 134.157.0.0 - 134.157.255.255, "4 Place Jussieu, 75252 Paris CEDEX 05,
  France"), the university's own historic Jussieu allocation, announced from AS1307 and
  AS2200. It presents an organization-validated TLS certificate issued to
  "C=FR, L=Paris, O=SORBONNE UNIVERSITE, CN=auth.id.sorbonne-universite.fr" through the
  GEANT Trusted Certificate Service (issuer "GEANT TLS RSA 1", Hellenic Academic and
  Research Institutions CA) — a certificate the university procured for itself, not one
  issued to a hosting platform. The `llng` CNAME and the `lemonldapF5` session cookie
  identify the software as LemonLDAP::NG, the French open-source WebSSO stack, fronted by
  the university's own F5 load balancer. There is no managed-IdP CNAME, no cloud provider
  in the path, and no third-party address space anywhere in the chain.

  Sorbonne registers four entities in the RENATER federation, all with
  Organization = Sorbonne Universite and all on hosts inside the university's own
  address space: one identity provider and three service providers, two of which sit on
  *.prod.dsi.sorbonne-universite.fr — the university's own Direction du Systeme
  d'Information production estate. The IdP carries the REFEDS Research & Scholarship
  entity category and a REFEDS SIRTFI assurance certification, and RENATER interfederates
  into eduGAIN, so the entity is reachable worldwide.

  This is the finding worth recording about Sorbonne: an institution with no public
  developer portal, no open-data portal and no institution-operated REST API nevertheless
  operates and self-publishes a complete, signed, machine-readable SAML 2.0 contract on
  its own infrastructure. Identity federation is the surface class universities actually
  run, and it is almost never catalogued.

