aid: sorbonne
name: Sorbonne University
description: >-
  Sorbonne University (Sorbonne Universite) is a public research university in Paris,
  France, formed in 2018 from the merger of Paris-Sorbonne and Pierre et Marie Curie
  universities, serving roughly 53,000 students across faculties of Arts & Humanities,
  Health Sciences, and Science & Engineering. It operates no central developer portal, no
  open-data portal, and no institution-operated REST API, and this profile says so rather
  than padding the gap.

  What it does operate, and self-publish, is a complete machine-readable SAML 2.0 identity
  federation contract. The identity provider at auth.id.sorbonne-universite.fr serves a
  signed EntityDescriptor at a dereferenceable entityID, is registered in the RENATER
  federation with the REFEDS Research & Scholarship entity category and a SIRTFI assurance
  certification, and reaches the world through eduGAIN. Operator was settled by IP
  ownership rather than hostname: it CNAMEs to llng.sorbonne-universite.fr and resolves
  into FR-UPMC-NET, the university's own RIPE allocation at 4 Place Jussieu, behind an
  organization-validated GEANT TCS certificate issued to O=SORBONNE UNIVERSITE, running
  self-hosted LemonLDAP::NG. Three further RENATER service providers — including the 4EU+
  virtual campus platform and a federated-wifi portal — sit on the university's own
  production estate. SAML is therefore Sorbonne's only institution-operated education-regime
  conformance, and Shibboleth is deliberately not claimed: the stack is LemonLDAP::NG and
  SimpleSAMLphp, not Shibboleth.

  Everything else that looks like a Sorbonne API is a national or commercial platform on
  which the university holds an account, and is recorded here as a tenant relationship
  rather than as a Sorbonne contract: the HAL open archive and its OAI-PMH and Solr search
  endpoints are CCSD's (CNRS), the sorbonne-univ research-data collection runs on Recherche
  Data Gouv's Dataverse with DOIs minted under Recherche Data Gouv's DataCite account, and
  library discovery is Ex Libris Primo/Alma. The GitHub organization exists and holds no
  public repositories. The university's own HAL portal host serves an Anubis proof-of-work
  bot challenge, so the one institutional research surface on a Sorbonne domain is closed to
  agents.
