    and the DOIs are minted under Recherche Data Gouv's DataCite account (provider rdg,
    client rdg.prod). Sorbonne holds no DataCite membership of its own.

    The recorded baseURL is the Sorbonne-scoped collection path. The bare Dataverse
    root https://entrepot.recherche.data.gouv.fr/api/ answers 404 and is in any case the
    generic all-of-France base every French institution on this platform shares, which is
