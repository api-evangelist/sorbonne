  description: >-
    Sorbonne University's open archive of scholarly publications, harvestable over
    OAI-PMH 2.0 at the Sorbonne-scoped base URL
    https://api.archives-ouvertes.fr/oai/sorbonne-universite/, which returns a valid
    Identify response (HTTP 200, text/xml) declaring protocolVersion 2.0, an
    earliestDatestamp of 2002-09-23, YYYY-MM-DD granularity and repositoryIdentifier
