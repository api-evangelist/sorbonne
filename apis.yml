x-coverage:
  state: covered
  reason: no_public_api
  detail: >-
    Sorbonne University publishes no public developer-facing API, no developer portal, no
    open-data portal and no OpenAPI, AsyncAPI or other open specification. DNS resolution
    of api., data., opendata., calcul., hpc., bibliotheque., catalogue., edt. and eight
    further candidate subdomains under sorbonne-universite.fr returned NXDOMAIN for all
    but sacado (research computing, HTML only) and intranet; www.sorbonne-universite.fr
    returns 404 for /llms.txt, /.well-known/security.txt and /.well-known/apis.json; the
    GitHub organization github.com/sorbonne-universite exists and holds zero public
    repositories. That is the honest result and it is recorded rather than padded.

    One institution-operated machine-readable contract WAS found, and it is not a REST
    API: the SAML 2.0 EntityDescriptor the university self-publishes at
    auth.id.sorbonne-universite.fr, verified institution-operated by RIPE address space
    (FR-UPMC-NET), a GEANT TCS certificate issued to O=SORBONNE UNIVERSITE, and a
    self-hosted LemonLDAP::NG stack. Four RENATER entities in total, all on the
    university's own infrastructure. That is the single institution-operated conformance
    in the education regime (saml), and shibboleth is deliberately not claimed because the
    software is LemonLDAP::NG and SimpleSAMLphp.

    Four further surfaces are real institutional facts on platforms Sorbonne does not
    operate, and are recorded as tenant relationships with their contracts deliberately
    not saved here: HAL (CCSD/CNRS) for the open archive and its OAI-PMH and Solr
    endpoints, Recherche Data Gouv (INRAE) for the research-data collection and its
    DataCite DOI minting, and Ex Libris Primo/Alma for library discovery. The two HAL
    entries carried the generic all-of-France base URLs in the June 2026 profile —
    /oai/hal/ and /search/ — which three other institutions in this cohort also claim;
    both have been re-based onto the Sorbonne-scoped paths.

    One access obstacle worth naming: hal.sorbonne-universite.fr, the only research
    surface on a Sorbonne domain, answers 200 with an Anubis proof-of-work bot challenge
    (c2sd-an-auth / c2sd-an-cookie-verification cookies) under a browser User-Agent, so it
    is live to humans and closed to agents; that host is itself a CNAME into CCSD address
    space (hal-sorbonne-universite.archives-ouvertes.fr, 193.48.96.10), so it is not a
    Sorbonne-operated surface either. The institutional AI page at
    /universite/politique-detablissement/intelligence-artificielle returns 403; the
    reachable AI-governance document is the Faculty of Health's generative-AI research
    recommendations, in French only.
