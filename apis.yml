- aid: sorbonne:dataverse
  name: Recherche Data Gouv Dataverse — sorbonne-univ collection
  x-operator: tenant
  description: >-
    Sorbonne University's research-data collection on the French national Recherche Data
    Gouv repository, addressable through the Dataverse Native REST API at
    https://entrepot.recherche.data.gouv.fr/api/dataverses/sorbonne-univ (HTTP 200,
    application/json), which returns the collection record with
    dataverseType ORGANIZATIONS_INSTITUTIONS, creationDate 2022-12-01 and the institutional
