- aid: sorbonne:identity-provider
  name: Sorbonne University Identity Provider (SAML 2.0)
  x-operator: institution
  description: >-
    Sorbonne University's federated login, published as a signed SAML 2.0 EntityDescriptor
    at https://auth.id.sorbonne-universite.fr/saml/metadata (HTTP 200, application/xml,
    11,704 bytes). Declares HTTP-Redirect, HTTP-POST and HTTP-Artifact single sign-on
