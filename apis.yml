    Recorded as a tenant relationship, not as a Sorbonne contract. The deposits and the
    harvest scope are Sorbonne's; the endpoint, the software and the administrative
    contact (contact@archives-ouvertes.fr) belong to CCSD, the CNRS unit that operates the
    national HAL infrastructure. The previous profile pointed this entry at the generic
    /oai/hal/ base URL, which is the whole-of-France endpoint three other institutions in
    this cohort also claimed; it has been re-based onto the Sorbonne scope.

    The operator verdict was corroborated by address space rather than hostname, the same
    test applied to the identity provider. Even the Sorbonne-branded portal host is not
    Sorbonne's: hal.sorbonne-universite.fr is a CNAME to
    hal-sorbonne-universite.archives-ouvertes.fr, which resolves to 193.48.96.10 — CCSD's
    address space, not FR-UPMC-NET. There is no HAL infrastructure on Sorbonne hardware.
